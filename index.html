<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold and BTC daily bias</title>
<style>
:root{
  --bg:#14202B; --panel:#1C2C3B; --line:#2D4254; --text:#EAE6DA; --mute:#9DAAB5;
  --bull:#5BC0A0; --bear:#E2685A; --gold:#D8AC4F; --btc:#E89A55;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:720px;margin:0 auto}
h1{font:600 18px/1.3 Georgia,serif;letter-spacing:.2px}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.banner{background:#3a2f1a;border:1px solid #6b5527;color:#f0d79a;padding:8px 12px;border-radius:6px;margin-top:12px;font-size:13px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mute);font:600 15px system-ui;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--text);border-color:var(--accent)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.hero{background:var(--panel);border-radius:12px;padding:18px 16px 16px}
.word{font:700 38px/1.1 Georgia,serif}
.score{color:var(--mute);margin-top:4px}
.scale{position:relative;height:34px;margin:18px 0 6px}
.scale .track{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--bear),#4a5a68 50%,var(--bull))}
.scale .mid{position:absolute;left:50%;top:8px;width:1px;height:18px;background:var(--mute)}
.scale .pin{position:absolute;top:6px;width:4px;height:22px;margin-left:-2px;border-radius:2px;background:var(--text)}
.scale .ghost{position:absolute;top:10px;width:12px;height:12px;margin-left:-6px;margin-top:3px;border-radius:50%;border:2px solid var(--text);background:var(--panel)}
.ends{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pair div{border-top:1px solid var(--line);padding-top:8px}
.pair b{display:block;font-size:12px;font-weight:500;color:var(--mute)}
.pair span{font:600 17px Georgia,serif}
.why{margin-top:14px;color:var(--mute);font-size:14px}
.why strong{color:var(--text);font-weight:600}
h2{font:600 15px Georgia,serif;margin:24px 0 8px}
.factor{border-top:1px solid var(--line)}
.factor summary{list-style:none;cursor:pointer;padding:10px 0;display:grid;grid-template-columns:1fr 112px 44px;gap:10px;align-items:center}
.factor summary::-webkit-details-marker{display:none}
.fname{font-size:14px}
.fname small{display:block;color:var(--mute);font-size:12px}
.bar{position:relative;height:10px;background:#243646;border-radius:5px}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.bar:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mute)}
.val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.factor p{padding:0 0 12px;color:var(--mute);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cell{background:var(--panel);border-radius:8px;padding:10px 12px}
.cell b{display:block;color:var(--mute);font-size:12px;font-weight:500}
.cell span{font:600 18px Georgia,serif;font-variant-numeric:tabular-nums}
ul{list-style:none;padding:0}
li{padding:6px 0;border-top:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:12px}
li em{color:var(--mute);font-style:normal}
svg{width:100%;height:70px;display:block}
.warn{color:#e9b66b;font-size:13px}
.foot{color:var(--mute);font-size:12px;margin:28px 0 8px}
@media (prefers-reduced-motion:no-preference){.pin{transition:left .5s ease}}
</style>
</head>
<body>
<h1>Gold and BTC daily bias</h1>
<p class="sub" id="stamp">Loading</p>
<div id="banner"></div>

<div class="tabs" role="tablist">
  <button role="tab" id="t-gold" aria-selected="true" data-a="gold">Gold (XAUUSD)</button>
  <button role="tab" id="t-btc" aria-selected="false" data-a="btc">Bitcoin (BTCUSD)</button>
</div>

<main id="app"></main>

<p class="foot">Rule-based scoring of public data. It describes the fundamental backdrop, not a trade signal. Use it to decide which direction to favour, then take entries from your own setup.</p>

<script>
const FALLBACK = {"generated_utc": "2026-10-11 02:31", "demo": true, "market": {"gold": 4020.0, "dxy": 97.8, "btc": 112000, "us10y": 4.05, "real10y": 1.7}, "assets": {"gold": {"composite": 42.8, "bias": "Strong bullish", "expected": 42.8, "expected_bias": "Strong bullish", "confidence": 71, "factors": [{"key": "policy", "name": "Rates and Fed policy", "score": 1.0, "weight": 1.5, "ok": true, "detail": "DEMO: Fed funds 3.75%, 2y yield 3.40% (-35bp). Market pricing cuts."}, {"key": "yields", "name": "Treasury and real yields", "score": 1.5, "weight": 2.0, "ok": true, "detail": "DEMO: 10y real yield 1.70% (-12bp in 1m)."}, {"key": "macro", "name": "CPI, PCE, NFP, unemployment", "score": 0.7, "weight": 1.0, "ok": true, "detail": "DEMO: CPI 2.9% y/y cooling; NFP 3m avg +70k; unemployment 4.5%."}, {"key": "dollar", "name": "US dollar (DXY)", "score": 1.0, "weight": 1.5, "ok": true, "detail": "DEMO: DXY 97.8, below its 50d average. 60d correlation with gold: -0.41."}, {"key": "risk", "name": "Geopolitical risk and safe haven", "score": 0.0, "weight": 1.0, "ok": true, "detail": "DEMO: VIX 17.5, S&P 500 -1.2% from 3m high."}, {"key": "demand", "name": "Central banks, ETFs, physical demand", "score": 1.5, "weight": 1.0, "ok": true, "detail": "DEMO: central-bank buying input +1; GLD +3.1% in 1m on rising volume."}, {"key": "sentiment", "name": "Positioning and market reaction", "score": -0.5, "weight": 1.0, "ok": true, "detail": "DEMO: gold extended, positioning crowded (93rd percentile). BTC above 50d, Fear & Greed 28."}], "supports": ["Treasury and real yields", "Rates and Fed policy"], "headwinds": ["Positioning and market reaction"], "coverage": "7/7 factors live"}, "btc": {"composite": 38.6, "bias": "Strong bullish", "expected": 38.6, "expected_bias": "Strong bullish", "confidence": 86, "factors": [{"key": "policy", "name": "Rates and Fed policy", "score": 1.0, "weight": 1.5, "ok": true, "detail": "DEMO: Fed funds 3.75%, 2y yield 3.40% (-35bp). Market pricing cuts."}, {"key": "yields", "name": "Treasury and real yields", "score": 1.5, "weight": 1.0, "ok": true, "detail": "DEMO: 10y real yield 1.70% (-12bp in 1m)."}, {"key": "macro", "name": "CPI, PCE, NFP, unemployment", "score": 0.7, "weight": 1.0, "ok": true, "detail": "DEMO: CPI 2.9% y/y cooling; NFP 3m avg +70k; unemployment 4.5%."}, {"key": "dollar", "name": "US dollar (DXY)", "score": 1.0, "weight": 1.0, "ok": true, "detail": "DEMO: DXY 97.8, below its 50d average. 60d correlation with gold: -0.41."}, {"key": "risk", "name": "Geopolitical risk and safe haven", "score": -0.0, "weight": 1.5, "ok": true, "detail": "DEMO: VIX 17.5, S&P 500 -1.2% from 3m high."}, {"key": "demand", "name": "Central banks, ETFs, physical demand", "score": 0.5, "weight": 1.5, "ok": true, "detail": "DEMO: central-bank buying input +1; GLD +3.1% in 1m on rising volume."}, {"key": "sentiment", "name": "Positioning and market reaction", "score": 1.0, "weight": 1.5, "ok": true, "detail": "DEMO: gold extended, positioning crowded (93rd percentile). BTC above 50d, Fear & Greed 28."}], "supports": ["Rates and Fed policy", "Treasury and real yields"], "headwinds": [], "coverage": "7/7 factors live"}}, "events": [{"date": "2026-10-28", "name": "FOMC rate decision"}, {"date": "2026-11-06", "name": "US jobs report (NFP), usual date"}, {"date": "2026-12-09", "name": "FOMC rate decision"}], "errors": [], "history": [{"date": "2026-10-11", "gold": 42.8, "btc": 38.6}]};
const ACCENT = {gold:'#D8AC4F', btc:'#E89A55'};
let DATA = null, current = 'gold';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col = v => v > 0.15 ? 'var(--bull)' : v < -0.15 ? 'var(--bear)' : 'var(--mute)';
const sgn = v => (v > 0 ? '+' : '') + v;

async function load(){
  try{
    const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
  }catch(e){
    DATA = FALLBACK;
    if(DATA) document.getElementById('banner').innerHTML = '<div class="banner">Showing sample data. Run fetch_bias.py (or deploy with the GitHub workflow) to get live numbers.</div>';
  }
  if(!DATA){ document.getElementById('stamp').textContent = 'No data yet. Run fetch_bias.py first.'; return; }
  document.getElementById('stamp').textContent = 'Updated ' + DATA.generated_utc + ' UTC' + (DATA.demo ? ' (sample)' : '');
  render();
}

function sparkline(asset){
  const h = (DATA.history || []).filter(x => asset in x);
  if(h.length < 2) return '<p class="sub">History builds up one point per day.</p>';
  const W = 600, H = 70, xs = i => i * W / (h.length - 1), ys = v => H / 2 - v / 100 * (H / 2 - 4);
  const pts = h.map((x, i) => xs(i).toFixed(1) + ',' + ys(x[asset]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Bias history">
    <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="#2D4254"/>
    <polyline points="${pts}" fill="none" stroke="${ACCENT[asset]}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function render(){
  const a = DATA.assets[current];
  document.documentElement.style.setProperty('--accent', ACCENT[current]);
  const pos = v => ((v + 100) / 2) + '%';
  const factors = a.factors.map(f => {
    const w = Math.abs(f.score) / 2 * 50;
    const bar = f.score >= 0 ? `left:50%;width:${w}%;background:var(--bull)` : `right:50%;width:${w}%;background:var(--bear)`;
    return `<details class="factor"><summary>
      <span class="fname">${esc(f.name)}<small>weight ${f.weight}${f.ok ? '' : ', no data'}</small></span>
      <span class="bar"><i style="${f.ok ? bar : 'display:none'}"></i></span>
      <span class="val" style="color:${f.ok ? col(f.score) : 'var(--mute)'}">${f.ok ? sgn(f.score) : 'n/a'}</span>
    </summary><p>${esc(f.detail)}</p></details>`;
  }).join('');

  const m = DATA.market || {};
  const cells = [
    ['Gold', m.gold && m.gold.toLocaleString()], ['Bitcoin', m.btc && '$' + m.btc.toLocaleString()],
    ['DXY', m.dxy], ['US 10y yield', m.us10y && m.us10y + '%'], ['10y real yield', m.real10y && m.real10y + '%'],
  ].filter(c => c[1]).map(c => `<div class="cell"><b>${c[0]}</b><span>${esc(c[1])}</span></div>`).join('');

  const events = (DATA.events || []).map(e => `<li><span>${esc(e.name)}</span><em>${esc(e.date)}</em></li>`).join('');
  const sup = a.supports.length ? `<strong>Supporting:</strong> ${a.supports.map(esc).join(', ')}. ` : '';
  const head = a.headwinds.length ? `<strong>Working against:</strong> ${a.headwinds.map(esc).join(', ')}.` : '';
  const errs = (DATA.errors || []).length ? `<h2>Data warnings</h2><p class="warn">${DATA.errors.map(esc).join('<br>')}</p>` : '';

  document.getElementById('app').innerHTML = `
  <section class="hero">
    <div class="word" style="color:${col(a.composite)}">${esc(a.bias)}</div>
    <div class="score">Today's bias score ${sgn(a.composite)} of 100 · ${esc(a.coverage)}</div>
    <div class="scale" aria-hidden="true"><div class="track"></div><div class="mid"></div>
      <div class="ghost" style="left:${pos(a.expected)}"></div><div class="pin" style="left:${pos(a.composite)}"></div></div>
    <div class="ends"><span>-100 bearish</span><span>0</span><span>bullish +100</span></div>
    <div class="pair">
      <div><b>Expected bias, next 1-5 days (hollow marker)</b><span style="color:${col(a.expected)}">${esc(a.expected_bias)}</span></div>
      <div><b>Factor agreement</b><span>${a.confidence}%</span></div>
    </div>
    <p class="why">${sup}${head}</p>
  </section>
  <h2>What is driving it (tap a row)</h2>
  <div>${factors}</div>
  <h2>Bias history</h2>${sparkline(current)}
  <h2>Market snapshot</h2><div class="grid">${cells}</div>
  <h2>Coming up</h2><ul>${events}</ul>${errs}`;
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  current = b.dataset.a;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  if(DATA) render();
}));
document.documentElement.style.setProperty('--accent', ACCENT.gold);
load();
</script>
</body>
</html>

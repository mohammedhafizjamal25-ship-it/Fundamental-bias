name: Bias site 2
on:
  schedule:
    - cron: "*/15 * * * 1-5"
    - cron: "0 * * * 0,6"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: bias2
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python fetch_v2.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "bias-bot"
          git config user.email "bias-bot@users.noreply.github.com"
          git add pairs_v2.json
          git diff --cached --quiet || git commit -m "Update site 2 $(date -u +%F-%H%M)"
          git pull --rebase
          git push

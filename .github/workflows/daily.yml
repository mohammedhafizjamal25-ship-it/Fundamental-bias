name: Update daily bias
on:
  schedule:
    - cron: "15 6 * * 1-5"
    - cron: "45 12 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python fetch_bias.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_universal.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit data files
        run: |
          git config user.name "bias-bot"
          git config user.email "bias-bot@users.noreply.github.com"
          git add data.json
          if [ -f pairs_data.json ]; then git add pairs_data.json; fi
          git diff --cached --quiet || git commit -m "Update bias $(date -u +%F-%H%M)"
          git push
